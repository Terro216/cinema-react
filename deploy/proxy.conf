# Only included by the allowlisted metadata/poster locations below.
resolver 127.0.0.11 valid=300s ipv6=off;
resolver_timeout 3s;
proxy_ssl_server_name on;
proxy_ssl_name kinopoiskapiunofficial.tech;
proxy_ssl_verify on;
proxy_ssl_verify_depth 5;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_connect_timeout 3s;
proxy_read_timeout 5s;
proxy_send_timeout 3s;
proxy_next_upstream off;
proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_pass_request_body off;
proxy_set_header Host kinopoiskapiunofficial.tech;
proxy_set_header User-Agent cinema-react;
proxy_set_header Connection "";
proxy_set_header Content-Length "";
proxy_hide_header Set-Cookie;
proxy_cache metadata;
proxy_cache_key $request_uri;
proxy_cache_valid 200 10m;
proxy_cache_valid 400 404 30s;
proxy_cache_lock on;
proxy_cache_lock_timeout 6s;
proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
proxy_ignore_headers Cache-Control Expires Set-Cookie;
proxy_max_temp_file_size 2m;
