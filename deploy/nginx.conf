worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_cache_path /tmp/metadata levels=1:2 keys_zone=metadata:2m max_size=8m inactive=30m;
    limit_req_zone $binary_remote_addr zone=metadata_rate:1m rate=5r/s;
    map $uri $cache_policy {
        default "no-cache";
        ~^/assets/ "public, max-age=31536000, immutable";
        ~^/posters/ "public, max-age=86400";
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        set $cinema_api_enabled "${KP_API_ENABLED}";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control $cache_policy always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        location ~ ^/api/(v2\.1/films/(filters|search-by-keyword|search-by-filters|[0-9]+)|v2\.2/films/(top|[0-9]+/similars))$ {
            if ($request_method != GET) { return 405; }
            if ($cinema_api_enabled = 0) { return 503; }
            access_log off;
            limit_req zone=metadata_rate burst=20 nodelay;
            limit_req_status 429;
            include /etc/nginx/cinema-proxy.conf;
            proxy_set_header X-API-KEY "${KP_API_KEY}";
            proxy_set_header Accept application/json;
            proxy_pass https://kinopoiskapiunofficial.tech$request_uri;
            add_header X-Cinema-Metadata $upstream_cache_status always;
            add_header X-Content-Type-Options nosniff always;
        }
        location /api/ { return 404; }
        location ~ ^/images/posters/(kp|kp_small)/[0-9]+\.(jpg|png)$ {
            if ($request_method != GET) { return 405; }
            include /etc/nginx/cinema-proxy.conf;
            proxy_set_header Accept "image/*";
            proxy_pass https://kinopoiskapiunofficial.tech$request_uri;
        }
        location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
        location /assets/ { try_files $uri =404; }
        location /posters/ { try_files $uri =404; }
        location /data/ { try_files $uri =404; }
        location /players/ {
            add_header Content-Security-Policy "default-src https: data: blob:; script-src https: 'unsafe-inline' 'unsafe-eval'; style-src https: 'unsafe-inline'; frame-ancestors 'self'; sandbox allow-scripts allow-forms allow-presentation" always;
            add_header Referrer-Policy no-referrer always;
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
