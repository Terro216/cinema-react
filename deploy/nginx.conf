worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $uri $cache_policy {
        default "no-cache";
        ~^/assets/ "public, max-age=31536000, immutable";
        ~^/posters/ "public, max-age=86400";
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control $cache_policy always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
        location /assets/ { try_files $uri =404; }
        location /posters/ { try_files $uri =404; }
        location /data/ { try_files $uri =404; }
        location /players/ {
            add_header Content-Security-Policy "default-src https: data: blob:; script-src https: 'unsafe-inline' 'unsafe-eval'; style-src https: 'unsafe-inline'; frame-ancestors 'self'; sandbox allow-scripts allow-forms allow-presentation" always;
            add_header Referrer-Policy no-referrer always;
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
